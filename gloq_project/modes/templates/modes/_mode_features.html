<!-- This replaces the content inside #mode-features div when Mystical mode is active -->

<style>
/* Mystical Tab Navigation */
.mystical-tabs {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem;
    background: linear-gradient(145deg, rgba(30, 27, 75, 0.3), rgba(17, 24, 39, 0.4));
    border-radius: 1rem;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(139, 92, 246, 0.15);
}

.mystical-tab {
    flex: 1;
    padding: 0.75rem 1rem;
    background: transparent;
    border: none;
    border-radius: 0.75rem;
    color: #94a3b8;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    position: relative;
    overflow: hidden;
}

.mystical-tab::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(59, 130, 246, 0.1));
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 0.75rem;
}

.mystical-tab:hover::before {
    opacity: 1;
}

.mystical-tab:hover {
    color: #c4b5fd;
}

.mystical-tab.active {
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(59, 130, 246, 0.3));
    color: #ffffff;
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
}

.mystical-tab.active::before {
    opacity: 0;
}

.mystical-tab-icon {
    font-size: 1rem;
    filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.5));
}

/* Mystical Content Sections */
.mystical-section {
    display: none;
    animation: fadeInUp 0.4s ease;
}

.mystical-section.active {
    display: block;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Enhanced Loading States */
.mystical-loading {
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
}

.mystical-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid rgba(139, 92, 246, 0.2);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Mystical Card Styles (inherit from parent but ensure consistency) */
.mystical-content-card {
    background: linear-gradient(145deg, rgba(30, 27, 75, 0.4), rgba(17, 24, 39, 0.6));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(139, 92, 246, 0.15);
    border-radius: 1rem;
    padding: 1.5rem;
    box-shadow: 
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
    transition: all 0.3s ease;
}

.mystical-content-card:hover {
    border-color: rgba(139, 92, 246, 0.25);
    box-shadow: 
        0 12px 48px rgba(0, 0, 0, 0.5),
        0 0 40px rgba(139, 92, 246, 0.1);
}

/* Compact Section Headers */
.mystical-section-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid rgba(139, 92, 246, 0.2);
}

.mystical-section-title {
    font-size: 1.25rem;
    font-weight: 600;
    background: linear-gradient(135deg, #c4b5fd, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.mystical-section-icon {
    font-size: 1.25rem;
    color: #8b5cf6;
    filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.5));
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .mystical-tabs {
        flex-direction: column;
    }
    
    .mystical-tab {
        padding: 1rem;
    }
}

/* Override mode-transition for mystical content */
.mystical-section {
    opacity: 0;
    transition: opacity 0.3s ease;
}

.mystical-section.active {
    opacity: 1;
}
</style>

<!-- Mystical Navigation Tabs -->
<div class="mystical-tabs">
    <button class="mystical-tab active" data-tab="cosmic" onclick="switchMysticalTab('cosmic')">
        <span class="mystical-tab-icon">🌙</span>
        <span>Cosmic</span>
    </button>
    <button class="mystical-tab" data-tab="astrology" onclick="switchMysticalTab('astrology')">
        <span class="mystical-tab-icon">⭐</span>
        <span>Astrology</span>
    </button>
    <button class="mystical-tab" data-tab="interactive" onclick="switchMysticalTab('interactive')">
        <span class="mystical-tab-icon">🔮</span>
        <span>Interactive</span>
    </button>
</div>

<!-- Cosmic Dashboard Section -->
<div class="mystical-section active" id="cosmic-section">
    <div class="mystical-section-header">
        <i class="fas fa-stars mystical-section-icon"></i>
        <h3 class="mystical-section-title">Cosmic Dashboard</h3>
    </div>
    
    <div id="cosmic-dashboard-content" 
         hx-get="{% url 'deep_dive:moon_planets' %}" 
         hx-trigger="load"
         hx-swap="innerHTML">
        <!-- Loading State -->
        <div class="mystical-loading">
            <div class="mystical-spinner"></div>
            <p class="text-slate-400 text-sm">Loading cosmic data...</p>
        </div>
    </div>
</div>

<!-- Astrology Section -->
<div class="mystical-section" id="astrology-section">
    <div class="mystical-section-header">
        <i class="fas fa-chart-pie mystical-section-icon"></i>
        <h3 class="mystical-section-title">Birth Chart & Readings</h3>
    </div>
    
    <div id="astrology-content" 
         hx-get="{% url 'deep_dive:astro_chart_reading' %}" 
         hx-trigger="intersect once"
         hx-swap="innerHTML">
        <!-- Loading State -->
        <div class="mystical-loading">
            <div class="mystical-spinner"></div>
            <p class="text-slate-400 text-sm">Preparing your chart...</p>
        </div>
    </div>
</div>

<!-- Interactive Mystical Section -->
<div class="mystical-section" id="interactive-section">
    <div class="mystical-section-header">
        <i class="fas fa-magic mystical-section-icon"></i>
        <h3 class="mystical-section-title">Tarot & Insights</h3>
    </div>
    
    <div id="interactive-content" 
         hx-get="{% url 'deep_dive:interactive_mystical' %}" 
         hx-trigger="intersect once"
         hx-swap="innerHTML">
        <!-- Loading State -->
        <div class="mystical-loading">
            <div class="mystical-spinner"></div>
            <p class="text-slate-400 text-sm">Channeling mystical energies...</p>
        </div>
    </div>
</div>

<script>
function switchMysticalTab(tabName) {
    // Update tab buttons
    document.querySelectorAll('.mystical-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
    
    // Update content sections with smooth transition
    document.querySelectorAll('.mystical-section').forEach(section => {
        section.classList.remove('active');
    });
    
    setTimeout(() => {
        document.getElementById(`${tabName}-section`).classList.add('active');
    }, 150);
    
    // Optional: Store active tab in session/localStorage
    localStorage.setItem('activeMysticalTab', tabName);
}

// Restore last active tab on load
document.addEventListener('DOMContentLoaded', function() {
    const lastTab = localStorage.getItem('activeMysticalTab');
    if (lastTab && lastTab !== 'cosmic') {
        switchMysticalTab(lastTab);
    }
});
</script>
