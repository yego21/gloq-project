{% extends "base.html" %}

{% block title %}Welcome - Gloq{% endblock %}

{% block mode_explorer %}
  <!-- Hide mode selector on landing page -->
{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
  <div class="text-center max-w-2xl">
    <!-- Main Heading -->
    <h2 class="text-4xl md:text-5xl font-bold text-gray-800 mb-4">
      Welcome to <span class="text-indigo-600">Gloq</span>
    </h2>
    <p class="text-gray-600 text-lg mb-10">
    
    </p>
    
    <!-- Two Column Layout for Login/Signup -->
    <div class="grid md:grid-cols-2 gap-6 max-w-3xl mx-auto">
      
      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100 hover:shadow-xl transition-shadow">
        <div class="mb-6">
          <div class="w-12 h-12 bg-indigo-100 rounded-xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <h3 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back</h3>
          <p class="text-gray-600 text-sm">
            Already have an account? Sign in to continue.
          </p>
        </div>
        <a href="{% url 'login' %}" 
           class="block w-full px-6 py-3 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition-colors font-medium">
          Login
        </a>
      </div>

      <!-- Signup Card -->
      <div class="bg-white rounded-2xl shadow-lg p-8 border border-gray-100 hover:shadow-xl transition-shadow">
        <div class="mb-6">
          <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
            </svg>
          </div>
          <h3 class="text-2xl font-bold text-gray-900 mb-2">New Here?</h3>
          <p class="text-gray-600 text-sm">
            Create an account to get started with Gloq.
          </p>
        </div>
        <a href="{% url 'signup' %}" 
           class="block w-full px-6 py-3 bg-purple-600 text-white rounded-lg shadow hover:bg-purple-700 transition-colors font-medium">
          Sign Up
        </a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
