<style>
  /* Glass effect refinement */
.glass-effect {
  backdrop-filter: blur(12px);
  background: rgba(244, 230, 244, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
}

/* Gradient button hover animation */
.gradient-bg {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  transition: background 0.3s ease, transform 0.2s ease;
}
.gradient-bg:hover {
  background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
  transform: translateY(-2px);
}

/* Form fade-in */
.fade-in {
  animation: fadeIn 0.6s ease-in-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Input styling for a cleaner look */



#journal-form input[type="text"],
#journal-form textarea,
#journal-form select {
  width: 100%;
  padding: 0.6rem 0.8rem;
  border-radius: 0.5rem;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.8);
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
#journal-form input:focus,
#journal-form textarea:focus,
#journal-form select:focus {
  outline: none;
  border-color: #764ba2;
  box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.3);
}
</style>

<form 
  id="journal-form"
  method="POST" 
  hx-post="{% url 'journal:new_journal_entry' %}"
  hx-target="this"
  hx-swap="none"
  hx-confirm="Are you sure you want to submit this journal entry?"
  class="max-w-lg mx-auto p-6 rounded-xl glass-effect fade-in shadow-lg space-y-6"
>
  {% csrf_token %}

  <h2 class="text-2xl font-bold text-white tracking-wide">Drop a note</h2>
  <p class="text-sm text-white/80">Reflect, write, and capture your thoughts.</p>

  <div class="space-y-4 text-gray-800">
    {{ form.as_p }}
  </div>

  <div class="flex justify-end">
    <button 
      type="submit"
      class="gradient-bg text-white px-6 py-2 rounded-lg shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5"
    >Submit Entry
    </button>
  </div>
</form>

<!-- Alert container for showing success/error messages -->
<div id="alert-container" class="mt-6"></div>
