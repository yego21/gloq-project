
<div id="mode-features">
<!-- mystical_mode_features.html -->
<div class="mystical-container">
    
    <!-- Compact Navigation Pills - Extensible -->
    <div class="mystical-nav-pills">
        <button class="mystical-pill active" data-section="overview">
            <span class="pill-icon">🌙</span>
            <span class="pill-label">Overview</span>
        </button>
        <button class="mystical-pill" data-section="chart">
            <span class="pill-icon">⭐</span>
            <span class="pill-label">Birth Chart</span>
        </button>
        <button class="mystical-pill" data-section="tarot">
            <span class="pill-icon">🔮</span>
            <span class="pill-label">Tarot</span>
        </button>
        <button class="mystical-pill" data-section="stats">
            <span class="pill-icon">📊</span>
            <span class="pill-label">Stats</span>
        </button>
        <!-- Future additions:
        <button class="mystical-pill" data-section="rituals">
            <span class="pill-icon">🕯️</span>
            <span class="pill-label">Rituals</span>
        </button>
        <button class="mystical-pill" data-section="crystals">
            <span class="pill-icon">💎</span>
            <span class="pill-label">Crystals</span>
        </button>
        -->
    </div>

    <!-- Content Sections -->
    <div class="mystical-content-area">
        
        <!-- Overview Section (Default - Cosmic Weather) -->
        <div class="mystical-section active" id="overview-section">
            <div hx-get="{% url 'deep_dive:moon_planets' %}"
                 hx-trigger="load"
                 hx-swap="innerHTML"
                 hx-indicator=".overview-loading">
                <div class="mystical-loading overview-loading">
                    <div class="loading-spinner"></div>
                    <p>Loading cosmic weather...</p>
                </div>
            </div>
        </div>

        <!-- Birth Chart Section -->
        <div class="mystical-section" id="chart-section">
            <div hx-get="{% url 'deep_dive:astro_chart_reading' %}"
                 hx-trigger="intersect once"
                 hx-swap="innerHTML"
                 hx-indicator=".chart-loading">
                <div class="mystical-loading chart-loading">
                    <div class="loading-spinner"></div>
                    <p>Generating your birth chart...</p>
                </div>
            </div>
        </div>

        <!-- Tarot Section -->
        <div class="mystical-section" id="tarot-section">
            <div hx-get="{% url 'deep_dive:interactive_mystical' %}"
                 hx-trigger="intersect once"
                 hx-swap="innerHTML"
                 hx-indicator=".tarot-loading">
                <div class="mystical-loading tarot-loading">
                    <div class="loading-spinner"></div>
                    <p>Shuffling the cosmic deck...</p>
                </div>
            </div>
        </div>

      

    </div>
</div>
</div>

<script>
(function() {
    'use strict';
    
    function initMysticalNavigation() {
        const pills = document.querySelectorAll('.mystical-pill');
        const sections = document.querySelectorAll('.mystical-section');
        
        if (pills.length === 0) {
            console.log('No mystical pills found');
            return;
        }
        
        console.log('Initializing mystical navigation with', pills.length, 'pills');
        
        function switchSection(sectionName) {
            console.log('Switching to section:', sectionName);
            
            // Update pills - remove active from all
            pills.forEach(pill => pill.classList.remove('active'));
            
            // Add active to clicked pill
            const activePill = document.querySelector(`.mystical-pill[data-section="${sectionName}"]`);
            if (activePill) {
                activePill.classList.add('active');
            }
            
            // Hide all sections with fade
            sections.forEach(section => {
                section.classList.remove('active');
                section.style.opacity = '0';
            });
            
            // Show target section after brief delay for fade effect
            setTimeout(() => {
                const targetSection = document.getElementById(`${sectionName}-section`);
                if (targetSection) {
                    targetSection.classList.add('active');
                    targetSection.style.opacity = '1';
                    
                    // Trigger lazy load if content hasn't been loaded yet
                    const lazyContent = targetSection.querySelector('[hx-get]:not([data-loaded])');
                    if (lazyContent) {
                        console.log('Triggering lazy load for', sectionName);
                        htmx.trigger(lazyContent, 'intersect');
                        lazyContent.setAttribute('data-loaded', 'true');
                    }
                }
            }, 150);
            
            // Remember user's choice in localStorage
            localStorage.setItem('activeMysticalSection', sectionName);
        }
        
        // Add click handlers to pills
        pills.forEach(pill => {
            pill.addEventListener('click', function() {
                const section = this.getAttribute('data-section');
                if (section) {
                    switchSection(section);
                }
            });
        });
        
        // Restore last viewed section on page load
        const lastSection = localStorage.getItem('activeMysticalSection');
        if (lastSection && lastSection !== 'overview') {
            // Small delay to ensure DOM is ready
            setTimeout(() => switchSection(lastSection), 100);
        }
        
        console.log('Mystical navigation initialized');
    }
    
    // Initialize immediately
    initMysticalNavigation();
    
    // Re-initialize after HTMX swaps in new mode content
    document.addEventListener('htmx:afterSettle', function(evt) {
        if (evt.detail.target.id === 'mode-features' || 
            evt.detail.target.closest('#mode-features')) {
            console.log('Re-initializing mystical navigation after HTMX swap');
            setTimeout(initMysticalNavigation, 100);
        }
    });
    
    // Also reinitialize on htmx:load for the mode-features container
    document.body.addEventListener('htmx:load', function(evt) {
        if (evt.detail.elt.id === 'mode-features' || 
            evt.detail.elt.closest('#mode-features')) {
            console.log('Mystical navigation loaded via htmx:load');
            setTimeout(initMysticalNavigation, 100);
        }
    });
})();
</script>
