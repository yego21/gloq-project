<style>
/* Mystical Tab Navigation - Light Theme */
.mystical-tabs {
    display: flex;
    gap: 0.5rem;
    padding: 0.5rem;
    background: linear-gradient(145deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.08));
    border-radius: 1rem;
    margin-bottom: 1.5rem;
    border: 1px solid rgba(139, 92, 246, 0.2);
}

.mystical-tab {
    flex: 1;
    padding: 0.75rem 1rem;
    background: transparent;
    border: none;
    border-radius: 0.75rem;
    color: #64748b; /* Readable gray */
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    position: relative;
    overflow: hidden;
}

.mystical-tab::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(99, 102, 241, 0.1));
    opacity: 0;
    transition: opacity 0.3s ease;
    border-radius: 0.75rem;
}

.mystical-tab:hover::before {
    opacity: 1;
}

.mystical-tab:hover {
    color: #6366f1; /* Indigo on hover */
}

.mystical-tab.active {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
    color: #6366f1; /* Indigo for active */
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.2);
}

.mystical-tab.active::before {
    opacity: 0;
}

.mystical-tab-icon {
    font-size: 1rem;
    filter: none; /* Remove glow effect */
}

/* Mystical Content Sections */
.mystical-section {
    display: none;
    animation: fadeInUp 0.4s ease;
}

.mystical-section.active {
    display: block;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Enhanced Loading States */
.mystical-loading {
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
}

.mystical-spinner {
    width: 48px;
    height: 48px;
    border: 3px solid rgba(99, 102, 241, 0.2);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Mystical Card Styles - Light Theme */
.mystical-content-card {
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.9), rgba(249, 250, 251, 0.9));
    backdrop-filter: blur(20px);
    border: 1px solid rgba(139, 92, 246, 0.15);
    border-radius: 1rem;
    padding: 1.5rem;
    box-shadow: 
        0 4px 16px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    transition: all 0.3s ease;
}

.mystical-content-card:hover {
    border-color: rgba(139, 92, 246, 0.3);
    box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.12),
        0 0 20px rgba(139, 92, 246, 0.1);
    transform: translateY(-2px);
}

/* Compact Section Headers - Light Theme */
.mystical-section-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid rgba(139, 92, 246, 0.15);
}

.mystical-section-title {
    font-size: 1.25rem;
    font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
}

.mystical-section-icon {
    font-size: 1.25rem;
    color: #8b5cf6;
    filter: none; /* Remove glow */
}

/* Text colors for light background */
.mystical-section p,
.mystical-section span,
.mystical-section div {
    color: #334155; /* Slate-700 for readability */
}

.mystical-section h1,
.mystical-section h2,
.mystical-section h3,
.mystical-section h4 {
    color: #1e293b; /* Slate-800 for headings */
}

/* Loading text */
.mystical-loading p {
    color: #64748b; /* Slate-500 */
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .mystical-tabs {
        flex-direction: column;
    }
    
    .mystical-tab {
        padding: 1rem;
    }
}

/* Section transitions */
.mystical-section {
    opacity: 0;
    transition: opacity 0.3s ease;
}

.mystical-section.active {
    opacity: 1;
}

/* Additional utility classes for content inside */
.mystical-text-primary {
    color: #1e293b;
}

.mystical-text-secondary {
    color: #64748b;
}

.mystical-text-accent {
    color: #8b5cf6;
}

.mystical-bg-card {
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid rgba(139, 92, 246, 0.15);
}
</style>

<!-- Mystical Navigation Tabs -->
<div class="mystical-tabs">
    <button class="mystical-tab active" data-tab="cosmic" type="button">
        <span class="mystical-tab-icon">🌙</span>
        <span>Cosmic</span>
    </button>
    <button class="mystical-tab" data-tab="astrology" type="button">
        <span class="mystical-tab-icon">⭐</span>
        <span>Astrology</span>
    </button>
    <button class="mystical-tab" data-tab="interactive" type="button">
        <span class="mystical-tab-icon">🔮</span>
        <span>Interactive</span>
    </button>
</div>

<!-- Cosmic Dashboard Section -->
<div class="mystical-section active" id="cosmic-section">
    <div class="mystical-section-header">
        <i class="fas fa-stars mystical-section-icon"></i>
        <h3 class="mystical-section-title">Cosmic Dashboard</h3>
    </div>
    
    <div id="cosmic-dashboard-content" 
         hx-get="{% url 'deep_dive:moon_planets' %}" 
         hx-trigger="load"
         hx-swap="innerHTML">
        <div class="mystical-loading">
            <div class="mystical-spinner"></div>
            <p>Loading cosmic data...</p>
        </div>
    </div>
</div>

<!-- Astrology Section -->
<div class="mystical-section" id="astrology-section">
    <div class="mystical-section-header">
        <i class="fas fa-chart-pie mystical-section-icon"></i>
        <h3 class="mystical-section-title">Birth Chart & Readings</h3>
    </div>
    
    <div id="astrology-content" 
         hx-get="{% url 'deep_dive:astro_chart_reading' %}" 
         hx-trigger="intersect once"
         hx-swap="innerHTML">
        <div class="mystical-loading">
            <div class="mystical-spinner"></div>
            <p>Preparing your chart...</p>
        </div>
    </div>
</div>

<!-- Interactive Mystical Section -->
<div class="mystical-section" id="interactive-section">
    <div class="mystical-section-header">
        <i class="fas fa-magic mystical-section-icon"></i>
        <h3 class="mystical-section-title">Tarot & Insights</h3>
    </div>
    
    <div id="interactive-content" 
         hx-get="{% url 'deep_dive:interactive_mystical' %}" 
         hx-trigger="intersect once"
         hx-swap="innerHTML">
        <div class="mystical-loading">
            <div class="mystical-spinner"></div>
            <p>Channeling mystical energies...</p>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';
    
    function initMysticalTabs() {
        const tabButtons = document.querySelectorAll('.mystical-tab');
        const sections = document.querySelectorAll('.mystical-section');
        
        if (tabButtons.length === 0) return;
        
        function switchTab(tabName) {
            tabButtons.forEach(tab => tab.classList.remove('active'));
            const activeButton = document.querySelector(`.mystical-tab[data-tab="${tabName}"]`);
            if (activeButton) {
                activeButton.classList.add('active');
            }
            
            sections.forEach(section => section.classList.remove('active'));
            
            setTimeout(() => {
                const targetSection = document.getElementById(`${tabName}-section`);
                if (targetSection) {
                    targetSection.classList.add('active');
                    
                    const lazyContent = targetSection.querySelector('[hx-get]:not([data-loaded])');
                    if (lazyContent) {
                        htmx.trigger(lazyContent, 'intersect');
                        lazyContent.setAttribute('data-loaded', 'true');
                    }
                }
            }, 150);
            
            localStorage.setItem('activeMysticalTab', tabName);
        }
        
        tabButtons.forEach(button => {
            button.addEventListener('click', function(e) {
                e.preventDefault();
                const tabName = this.getAttribute('data-tab');
                if (tabName) switchTab(tabName);
            });
        });
        
        const lastTab = localStorage.getItem('activeMysticalTab');
        if (lastTab && lastTab !== 'cosmic') {
            switchTab(lastTab);
        }
    }
    
    initMysticalTabs();
    
    document.addEventListener('htmx:afterSettle', function(evt) {
        if (evt.detail.target.closest('#mode-features')) {
            initMysticalTabs();
        }
    });
})();
</script>
