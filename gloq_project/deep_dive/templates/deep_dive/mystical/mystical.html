<script>
(function() {
    'use strict';
    
    // Initialize navigation system
    function initMysticalNavigation() {
        const mainNavButtons = document.querySelectorAll('.mystical-main-btn');
        const mainSections = document.querySelectorAll('.mystical-main-section');
        const quickActionCards = document.querySelectorAll('.quick-action-card');
        const subSections = document.querySelectorAll('.mystical-section');
        
        if (mainNavButtons.length === 0) {
            console.log('No mystical navigation found');
            return;
        }
        
        console.log('Initializing mystical navigation');
        
        // Main section navigation (Top level: Astrology, Tarot, etc.)
        function switchMainSection(sectionName) {
            console.log('Switching to main section:', sectionName);
            
            // Update main nav buttons
            mainNavButtons.forEach(btn => btn.classList.remove('active'));
            const activeMainBtn = document.querySelector(`.mystical-main-btn[data-main-section="${sectionName}"]`);
            if (activeMainBtn) {
                activeMainBtn.classList.add('active');
            }
            
            // Hide all main sections
            mainSections.forEach(section => {
                section.classList.remove('active');
                section.style.opacity = '0';
            });
            
            // Show target main section
            setTimeout(() => {
                const targetSection = document.getElementById(`${sectionName}-main-section`);
                if (targetSection) {
                    targetSection.classList.add('active');
                    targetSection.style.opacity = '1';
                    
                    // Trigger lazy load for the first visible sub-section
                    const firstSubSection = targetSection.querySelector('.mystical-section.active');
                    if (firstSubSection) {
                        const lazyContent = firstSubSection.querySelector('[hx-get]:not([data-loaded])');
                        if (lazyContent) {
                            console.log('Triggering lazy load for first sub-section in', sectionName);
                            htmx.trigger(lazyContent, 'intersect');
                            lazyContent.setAttribute('data-loaded', 'true');
                        }
                    }
                }
            }, 150);
            
            // Save state
            localStorage.setItem('activeMysticalMainSection', sectionName);
        }
        
        // Sub-section navigation (Within Astrology/Tarot: Overview, Chart, etc.)
        function switchSubSection(sectionName, parentMainSection) {
            console.log('Switching to sub-section:', sectionName, 'in', parentMainSection);
            
            const parentSection = document.getElementById(`${parentMainSection}-main-section`);
            if (!parentSection) return;
            
            // Update quick action cards within this main section only
            const cards = parentSection.querySelectorAll('.quick-action-card');
            cards.forEach(card => card.classList.remove('active'));
            
            const activeCard = parentSection.querySelector(`.quick-action-card[data-section="${sectionName}"]`);
            if (activeCard) {
                activeCard.classList.add('active');
            }
            
            // Hide all sub-sections within this main section
            const sections = parentSection.querySelectorAll('.mystical-section');
            sections.forEach(section => {
                section.classList.remove('active');
                section.style.opacity = '0';
            });
            
            // Show target sub-section
            setTimeout(() => {
                const targetSection = parentSection.querySelector(`#${sectionName}-section`);
                if (targetSection) {
                    targetSection.classList.add('active');
                    targetSection.style.opacity = '1';
                    
                    // Trigger lazy load if content hasn't been loaded yet
                    const lazyContent = targetSection.querySelector('[hx-get]:not([data-loaded])');
                    if (lazyContent) {
                        console.log('Triggering lazy load for', sectionName);
                        htmx.trigger(lazyContent, 'intersect');
                        lazyContent.setAttribute('data-loaded', 'true');
                    }
                }
            }, 150);
            
            // Save state
            localStorage.setItem(`activeSubSection_${parentMainSection}`, sectionName);
        }
        
        // Add click handlers to main nav buttons
        mainNavButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const section = this.getAttribute('data-main-section');
                if (section) {
                    switchMainSection(section);
                }
            });
        });
        
        // Add click handlers to quick action cards
        quickActionCards.forEach(card => {
            card.addEventListener('click', function() {
                const section = this.getAttribute('data-section');
                const parentMainSection = this.closest('.mystical-main-section').id.replace('-main-section', '');
                if (section) {
                    switchSubSection(section, parentMainSection);
                }
            });
        });
        
        // Restore last viewed sections on page load
        const lastMainSection = localStorage.getItem('activeMysticalMainSection');
        if (lastMainSection && lastMainSection !== 'astrology') {
            setTimeout(() => switchMainSection(lastMainSection), 100);
        } else {
            // Ensure default astrology section's overview loads
            const defaultOverview = document.querySelector('#overview-section [hx-get]:not([data-loaded])');
            if (defaultOverview && typeof htmx !== 'undefined') {
                setTimeout(() => {
                    htmx.trigger(defaultOverview, 'load');
                    defaultOverview.setAttribute('data-loaded', 'true');
                }, 100);
            }
        }
        
        // Restore sub-sections for each main section
        ['astrology', 'tarot'].forEach(mainSec => {
            const lastSubSection = localStorage.getItem(`activeSubSection_${mainSec}`);
            if (lastSubSection) {
                setTimeout(() => {
                    const mainSection = document.getElementById(`${mainSec}-main-section`);
                    if (mainSection && mainSection.classList.contains('active')) {
                        switchSubSection(lastSubSection, mainSec);
                    }
                }, 200);
            }
        });
        
        console.log('Mystical navigation initialized');
    }
    
    // Initialize immediately
    initMysticalNavigation();
    
    // Re-initialize after HTMX swaps
    document.addEventListener('htmx:afterSettle', function(evt) {
        if (evt.detail.target.id === 'mode-features' || 
            evt.detail.target.closest('#mode-features')) {
            console.log('Re-initializing mystical navigation after HTMX swap');
            setTimeout(initMysticalNavigation, 100);
        }
    });
    
    document.body.addEventListener('htmx:load', function(evt) {
        if (evt.detail.elt.id === 'mode-features' || 
            evt.detail.elt.closest('#mode-features')) {
            console.log('Mystical navigation loaded via htmx:load');
            setTimeout(initMysticalNavigation, 100);
        }
    });
})();
</script>
